name: Go
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Cluster tests in cluster_test.go run against docker-compose's redis-cluster.
  REDCACHE_CLUSTER_ADDRS: 127.0.0.1:30001

jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    services:
      redis:
        # Pinned to match the tag used in docker-compose.yml for local dev.
        image: redis:7.2.4-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: .tool-versions
          cache: true
          cache-dependency-path: go.sum
      - name: Start Redis Cluster
        run: docker compose up -d --wait redis-cluster
      - name: Run race tests
        run: |
          set -o pipefail
          go test -race -count=1 -json ./... | tee TestResults.json
      - name: Upload Go test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Go-results
          path: TestResults.json
          if-no-files-found: ignore

  coverage:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    services:
      redis:
        # Pinned to match the tag used in docker-compose.yml for local dev.
        image: redis:7.2.4-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: .tool-versions
          cache: true
          cache-dependency-path: go.sum
      - name: Start Redis Cluster
        run: docker compose up -d --wait redis-cluster
      - name: Check coverage
        run: make cover-check GO=go
      - name: Coverage summary
        run: go tool cover -func=coverage.out
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.out
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          fail_ci_if_error: false
          # Public repos can upload tokenlessly. If Codecov requires a token,
          # set CODECOV_TOKEN as a repository secret and it will be picked up here.
          token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: .tool-versions
          cache: true
          cache-dependency-path: go.sum
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: --timeout=5m
