name: Scorecard

# Keep this workflow aligned with Scorecard publishing restrictions:
# supported triggers only, no top-level env/defaults, no workflow-level write
# permissions, and only approved actions in the Scorecard job.
on:
  push:
    branches: [main]
  schedule:
    - cron: '25 4 * * 1'

permissions:
  contents: read

jobs:
  scorecard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload Scorecard SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
