name: Govulncheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * 3'

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1.0.4
        with:
          # Scan with the oldest supported Go release. go.mod keeps the 1.25
          # minimum, but 1.25 is out of support and has unfixed stdlib CVEs
          # (GO-2026-6809, GO-2026-6607), so users should build with 1.26.9+.
          go-version-input: '1.26.x'
          go-package: ./...
          repo-checkout: false
          cache: true
          cache-dependency-path: go.sum
